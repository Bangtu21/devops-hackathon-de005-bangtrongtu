server {
    listen 8083;
    listen [::]:8083;


    server_name _;

    root /var/www/devops-hackathon-de005-bangtrongtu/src;
    index index.html, index.htm;

    access_log /var/log/nginx/bangtrongtu-k24cntt3.access.log;
    error_log /var/log/nginx/bangtrongtu-k24cntt3.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

